[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mswp-fuse"
version = "0.1.0"
description = "Training and inference code for MSWP-Fuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2023.9",
    "netCDF4>=1.6",
    "PyYAML>=6.0",
    "torch>=2.2",
    "lightgbm==4.6.0",
    "xgboost==3.3.0",
]

[project.scripts]
mswpfuse = "mswpfuse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
